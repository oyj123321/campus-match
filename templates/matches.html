{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>💘 {{ user.school }} · 匹配中心</h2>
    <p class="hint">
        {% if config.MATCH_MODE == 'batch' %}
        🎯 批量匹配模式：每周二晚 9 点统一执行，每人只匹配一个对象
        {% else %}
        ⚡ 实时匹配模式：随时触发，返回 Top-N 匹配
        {% endif %}
    </p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-match" id="match-btn" onclick="startMatch()">💘 开始匹配</button>
        <button class="btn btn-secondary" onclick="loadHistory()">📋 查看历史匹配</button>
        <a href="/questionnaire" class="btn btn-secondary">✏️ 修改问卷</a>
    </div>
</div>

<div id="match-result" style="margin-top:16px;"></div>
<div id="history-result" style="margin-top:16px;"></div>

<script>
async function startMatch() {
    const btn = document.getElementById('match-btn');
    const div = document.getElementById('match-result');
    btn.disabled = true;
    btn.textContent = '匹配中...';
    div.innerHTML = '<div class="card"><p>⏳ 正在分析你的问卷答案，在全校范围内寻找最合拍的人...</p></div>';

    const data = await api('POST', '/api/match', {});
    btn.disabled = false;
    btn.textContent = '💘 重新匹配';

    if (!data.ok) {
        div.innerHTML = `<div class="card error">❌ ${data.error}</div>`;
        return;
    }

    if (data.matches.length === 0) {
        div.innerHTML = `
        <div class="card" style="text-align:center;">
            <p style="font-size:1.2em;">😔 ${data.message || '暂无匹配结果'}</p>
            <p class="hint">当前匹配人数: ${data.total_candidates || 0} 人</p>
            <p class="hint">试试扩大兴趣范围，或邀请更多同学加入</p>
        </div>`;
        return;
    }

    let html = `<div class="card"><p>✅ 扫描 ${data.total_candidates} 人，找到 ${data.matches.length} 个匹配：</p></div>`;
    data.matches.forEach((m, i) => {
        const pct = Math.round(m.score * 100);
        const barColor = pct >= 70 ? '#059669' : pct >= 50 ? '#2563eb' : '#999';
        html += `
        <div class="card match-result-card">
            <div class="match-header">
                <span class="match-rank-badge">#${i + 1}</span>
                <span class="match-name">${m.name}</span>
                <span class="match-gender">${m.gender === 'male' ? '👦' : '👧'}</span>
                <span class="match-score" style="color:${barColor};">${pct}% 匹配</span>
            </div>
            <div style="margin:12px 0;">
                <div style="background:#e5e7eb;border-radius:99px;height:8px;">
                    <div style="background:${barColor};width:${pct}%;height:8px;border-radius:99px;"></div>
                </div>
            </div>
            ${m.strengths && m.strengths.length > 0 ? `
            <div style="margin:8px 0;">
                <strong>💚 共同点：</strong>
                ${m.strengths.map(s => `<span class="tag" style="background:#d1fae5;color:#065f46;">${s}</span>`).join(' ')}
            </div>` : ''}
            <div style="margin-top:8px;font-size:1.1em;color:#2563eb;font-weight:bold;">
                📱 微信: ${m.wechat_id || '未填写'}
            </div>
            ${m.differences_count > 0 ? `<p class="hint">⚡ 有 ${m.differences_count} 个方面存在差异，沟通时注意包容</p>` : ''}
        </div>`;
    });
    html += '<p class="hint">📧 匹配结果已发送到双方学校邮箱</p>';
    div.innerHTML = html;
}

async function loadHistory() {
    const div = document.getElementById('history-result');
    div.innerHTML = '<p class="hint">⏳ 加载中...</p>';

    const data = await api('GET', '/api/matches');
    if (!data.ok) {
        div.innerHTML = `<p class="error">❌ ${data.error}</p>`;
        return;
    }

    if (data.matches.length === 0) {
        div.innerHTML = '<div class="card"><p class="hint">暂无匹配记录</p></div>';
        return;
    }

    let html = '';
    data.matches.forEach(m => {
        const pct = Math.round(m.score * 100);
        html += `
        <div class="card" style="margin-bottom:8px;">
            <strong>${m.name}</strong> · ${m.school}
            <span class="tag-badge">${pct}%</span>
            <span class="tag-badge">${m.mode === 'batch' ? '定时匹配' : '实时匹配'}</span>
            <div style="margin-top:4px;color:#2563eb;">微信: ${m.wechat_id}</div>
            ${m.strengths && m.strengths.length > 0 ? `<div style="margin-top:4px;font-size:0.85em;color:#666;">${m.strengths.join(' · ')}</div>` : ''}
            <div style="font-size:0.75em;color:#999;">${m.matched_at ? new Date(m.matched_at).toLocaleString('zh-CN') : ''}</div>
        </div>`;
    });
    div.innerHTML = html;
}

// 自动加载历史
loadHistory();
</script>
{% endblock %}
