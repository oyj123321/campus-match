{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>② 验证邮箱</h2>
    <p>验证码已发送至 <strong>{{ email }}</strong></p>
    <p class="hint">检查收件箱和垃圾邮件文件夹。开发模式下验证码打印在服务器终端。</p>

    <div class="form-group">
        <label for="token">验证码（6 位）</label>
        <input type="text" id="token" placeholder="输入验证码" maxlength="8" autocomplete="one-time-code"
               style="font-size:1.4em;letter-spacing:4px;text-align:center;"
               onkeydown="if(event.key==='Enter')verify()" autofocus>
    </div>
    <button class="btn btn-primary" id="verify-btn" onclick="verify()">验证</button>
    <button class="btn btn-secondary" onclick="resend()">重新发送</button>

    <div id="status-area" style="margin-top:16px;">
        <p id="verify-status"></p>
    </div>
</div>

<script>
async function verify() {
    const token = document.getElementById('token').value.trim();
    if (!token) { alert('请输入验证码'); return; }

    const btn = document.getElementById('verify-btn');
    const status = document.getElementById('verify-status');

    btn.disabled = true;
    btn.textContent = '验证中...';
    status.innerHTML = '<span class="t-dim">验证中...</span>';

    const data = await api('POST', '/api/verify', {
        email: '{{ email }}',
        token: token,
    });

    btn.disabled = false;
    btn.textContent = '验证';

    if (data.ok) {
        status.innerHTML = '<span class="t-ok">验证成功！跳转中...</span>';
        setTimeout(function() {
            window.location.href = '/questionnaire';
        }, 600);
    } else {
        status.innerHTML = '<span class="t-err">' + data.error + '</span>';
    }
}

async function resend() {
    const status = document.getElementById('verify-status');
    status.innerHTML = '<span class="t-dim">重新发送中...</span>';

    const data = await api('POST', '/api/resend-verification', {
        email: '{{ email }}',
    });

    if (data.ok) {
        var info = '已重新发送';
        if (data.dev_token) {
            info += '<br><span class="code-chip">验证码：<code style="font-size:1.4em;">' + data.dev_token + '</code></span>';
        }
        status.innerHTML = '<span class="t-ok">' + info + '</span>';
    } else {
        status.innerHTML = '<span class="t-err">' + data.error + '</span>';
    }
}
</script>
{% endblock %}
