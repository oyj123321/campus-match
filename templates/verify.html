{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2 data-i18n="vf.title">② 验证邮箱</h2>
    <p><span data-i18n="vf.sentTo">验证码已发送至</span> <strong>{{ email }}</strong></p>
    <p class="hint" data-i18n="vf.spam">检查收件箱和垃圾邮件文件夹。开发模式下验证码打印在服务器终端。</p>

    <div class="form-group">
        <label for="token" data-i18n="form.token">验证码（6 位）</label>
        <input type="text" id="token" placeholder="输入验证码" data-i18n-ph="form.token.ph" maxlength="8" autocomplete="one-time-code"
               style="font-size:1.4em;letter-spacing:4px;text-align:center;"
               onkeydown="if(event.key==='Enter')verify()" autofocus>
    </div>
    <button class="btn btn-primary" id="verify-btn" onclick="verify()"><span data-i18n="btn.verify">验证</span></button>
    <button class="btn btn-secondary" onclick="resend()"><span data-i18n="btn.resendCode">重新发送</span></button>

    <div id="status-area" style="margin-top:16px;">
        <p id="verify-status"></p>
    </div>
</div>

<script>
async function verify() {
    const email = '{{ email }}';
    const token = document.getElementById('token').value.trim();
    const isBeta = /^(cmtest|beta|test)\d+@/i.test(email);
    if (!token && !isBeta) { alert(t('msg.enterToken')); return; }

    const btn = document.getElementById('verify-btn');
    const status = document.getElementById('verify-status');

    btn.disabled = true;
    btn.textContent = t('msg.verifying');
    status.innerHTML = '<span class="t-dim">' + t('msg.verifying') + '</span>';

    const data = await api('POST', '/api/verify', {
        email: '{{ email }}',
        token: token,
    });

    btn.disabled = false;
    btn.textContent = t('btn.verify');

    if (data.ok) {
        status.innerHTML = '<span class="t-ok">' + t('vf.ok') + '</span>';
        setTimeout(function() {
            window.location.href = '/';
        }, 600);
    } else {
        status.innerHTML = '<span class="t-err">' + data.error + '</span>';
    }
}

async function resend() {
    const status = document.getElementById('verify-status');
    status.innerHTML = '<span class="t-dim">' + t('vf.resending') + '</span>';

    const data = await api('POST', '/api/resend-verification', {
        email: '{{ email }}',
    });

    if (data.ok) {
        var info = t('vf.resent');
        if (data.dev_token) {
            info += '<br><span class="code-chip">' + t('vf.code') + '<code style="font-size:1.4em;">' + data.dev_token + '</code></span>';
        }
        status.innerHTML = '<span class="t-ok">' + info + '</span>';
    } else {
        status.innerHTML = '<span class="t-err">' + data.error + '</span>';
    }
}
</script>
{% endblock %}
