{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
    </div>
    <p style="text-align:center;color:#999;font-size:0.85em;" id="progress-text">0/32 题已答</p>

    <h2>📝 Step 3: 深度问卷</h2>
    <p class="hint">参考 SJTU Date 的 65 题设计，提炼为 32 题四维问卷。<br>每题可点击 ⭐ 标记为"对我很重要"（权重翻倍）。红色题目为一票否决项。</p>
</div>

<form id="q-form">
<div id="questions-container">
    <!-- JS 动态渲染 -->
</div>

<div class="card" style="text-align:center;">
    <button type="button" class="btn btn-match" onclick="submitQuestionnaire()" style="font-size:1.1em;padding:14px 48px;">
        💾 提交问卷 & 开始匹配
    </button>
    <p id="save-status" style="margin-top:8px;"></p>
</div>
</form>

<script>
// 问卷数据（从服务端渲染）
const QUESTIONS = {{ questions | tojson | safe }};
const EXISTING_ANSWERS = {{ user.answers | tojson | safe }};
const EXISTING_IMPORTANT = {{ user.important_qids | list | tojson | safe }};

const dimensionNames = {
    'values': '💭 核心价值观',
    'lifestyle': '🏠 生活习惯',
    'emotional': '❤️ 情感风格',
    'interests': '🎯 兴趣爱好',
};

const dimensionColors = {
    'values': '#7c3aed',
    'lifestyle': '#059669',
    'emotional': '#db2777',
    'interests': '#2563eb',
};

let currentDim = null;
let currentAnswers = {};
let currentImportant = new Set(EXISTING_IMPORTANT.map(String));

// 初始化已有答案
{% if user.answers %}
Object.assign(currentAnswers, {{ user.answers | tojson | safe }});
{% endif %}

function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    let dimIdx = 0;
    QUESTIONS.forEach((q, i) => {
        const dim = q.dimension;
        if (dim !== currentDim) {
            currentDim = dim;
            dimIdx++;
            container.innerHTML += `
            <div class="card dimension-card" style="border-left:4px solid ${dimensionColors[dim]};">
                <h3 style="color:${dimensionColors[dim]};margin-bottom:4px;">
                    ${dimensionNames[dim] || dim}
                </h3>
                <p style="color:#999;font-size:0.8em;margin-bottom:12px;">维度 ${dimIdx}/4</p>
            </div>`;
        }

        const qid = String(q.id);
        const val = currentAnswers[qid];
        const isImportant = currentImportant.has(qid);
        const isDealbreaker = q.dealbreaker;

        let inputHtml = '';
        if (q.type === 'scale') {
            const curVal = val || 3;
            inputHtml = `
            <div class="scale-container">
                <span class="scale-label left">${q.left}</span>
                <div class="scale-slider-wrapper">
                    <input type="range" min="1" max="5" value="${curVal}" class="scale-slider"
                        id="q_${qid}" oninput="updateScaleLabel(this, ${qid})" onchange="onAnswerChange(${qid})">
                    <div class="scale-ticks">
                        <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
                    </div>
                </div>
                <span class="scale-label right">${q.right}</span>
                <span class="scale-val" id="scale_val_${qid}">${curVal}</span>
            </div>`;
        } else if (q.type === 'multi') {
            const selected = Array.isArray(val) ? val : [];
            inputHtml = '<div class="multi-options">';
            q.options.forEach(opt => {
                const checked = selected.includes(opt) ? 'checked' : '';
                inputHtml += `
                <label class="multi-option ${checked ? 'selected' : ''}">
                    <input type="checkbox" value="${opt}" ${checked}
                        onchange="toggleMulti(this, ${qid})" style="display:none;">
                    <span>${opt}</span>
                </label>`;
            });
            inputHtml += '</div>';
        }

        const dealbreakerClass = isDealbreaker ? 'dealbreaker' : '';

        container.innerHTML += `
        <div class="card question-card ${dealbreakerClass}" id="qcard_${qid}">
            <div class="q-header">
                <span class="q-number">${q.id}</span>
                <span class="q-text">${q.text}</span>
                ${isDealbreaker ? '<span class="dealbreaker-badge">一票否决</span>' : ''}
            </div>
            <div class="q-input">${inputHtml}</div>
            <button type="button" class="important-toggle ${isImportant ? 'active' : ''}"
                id="imp_btn_${qid}" onclick="toggleImportant(${qid}, this)">
                ⭐ ${isImportant ? '对我很重要' : '标记为重要'}
            </button>
        </div>`;
    });

    updateProgress();
}

function updateScaleLabel(slider, qid) {
    document.getElementById('scale_val_' + qid).textContent = slider.value;
}

function onAnswerChange(qid) {
    const slider = document.getElementById('q_' + qid);
    if (slider) {
        currentAnswers[String(qid)] = parseInt(slider.value);
    }
    updateProgress();
}

function toggleMulti(checkbox, qid) {
    const qidStr = String(qid);
    if (!currentAnswers[qidStr]) currentAnswers[qidStr] = [];

    const val = checkbox.value;
    if (checkbox.checked) {
        if (!currentAnswers[qidStr].includes(val)) currentAnswers[qidStr].push(val);
        checkbox.parentElement.classList.add('selected');
    } else {
        currentAnswers[qidStr] = currentAnswers[qidStr].filter(v => v !== val);
        checkbox.parentElement.classList.remove('selected');
    }
    if (currentAnswers[qidStr].length === 0) delete currentAnswers[qidStr];
    updateProgress();
}

function toggleImportant(qid, btn) {
    const qidStr = String(qid);
    if (currentImportant.has(qidStr)) {
        currentImportant.delete(qidStr);
        btn.classList.remove('active');
        btn.innerHTML = '⭐ 标记为重要';
    } else {
        currentImportant.add(qidStr);
        btn.classList.add('active');
        btn.innerHTML = '⭐ 对我很重要';
    }
}

function updateProgress() {
    const answered = Object.keys(currentAnswers).length;
    const total = QUESTIONS.length;
    const pct = Math.round(answered / total * 100);
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-text').textContent = `${answered}/${total} 题已答 (${pct}%)`;
}

async function submitQuestionnaire() {
    const status = document.getElementById('save-status');
    status.innerHTML = '⏳ 保存中...';

    // 也收集 scale 题的当前值（未 onchange 触发的）
    QUESTIONS.forEach(q => {
        if (q.type === 'scale') {
            const slider = document.getElementById('q_' + q.id);
            if (slider) currentAnswers[String(q.id)] = parseInt(slider.value);
        }
    });

    const data = {
        answers: currentAnswers,
        important_qids: Array.from(currentImportant).map(Number),
    };

    const res = await api('POST', '/api/questionnaire', data);
    if (res.ok) {
        status.innerHTML = `✅ 已保存！特征向量维度: ${res.vector_dim}`;
        if (res.completed) {
            status.innerHTML += '<br>🎉 问卷完成！跳转到匹配页面...';
            setTimeout(() => { location.href = '/matches'; }, 1000);
        }
    } else {
        status.innerHTML = `❌ ${res.error}`;
    }
}

// 渲染
renderQuestions();
</script>
{% endblock %}
