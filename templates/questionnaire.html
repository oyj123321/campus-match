{% extends "base.html" %}
{% block content %}

<h2 style="text-align:center;margin-bottom:8px;">填写资料 & 问卷</h2>
<p class="hint" style="text-align:center;margin-bottom:16px;">共 {{ questions|length }} 题 · 请点选作答；未选不算已答</p>

<!-- 基本资料 -->
<div class="card" id="profile-card">
    <h3>基本信息</h3>
    <div class="form-row">
        <div class="form-group" style="flex:1;">
            <label for="name">昵称 *</label>
            <input type="text" id="name" value="{{ user.name or '' }}" placeholder="你的名字" autocomplete="nickname">
        </div>
        <div class="form-group" style="flex:1;">
            <label for="gender">我的性别 *</label>
            <select id="gender">
                <option value="">请选择</option>
                <option value="male" {% if user.gender == 'male' %}selected{% endif %}>男</option>
                <option value="female" {% if user.gender == 'female' %}selected{% endif %}>女</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label for="looking_for">希望匹配的性别（择偶取向）*</label>
        <select id="looking_for">
            <option value="">请选择</option>
            <option value="male" {% if user.looking_for == 'male' %}selected{% endif %}>男</option>
            <option value="female" {% if user.looking_for == 'female' %}selected{% endif %}>女</option>
            <option value="both" {% if user.looking_for == 'both' %}selected{% endif %}>男女都可以</option>
        </select>
        <p class="hint">男生可选男或女，女生也可选男或女；匹配需双方取向互相接受。</p>
    </div>
    <div class="form-row">
        <div class="form-group" style="flex:1;">
            <label for="wechat_id">微信号 *</label>
            <input type="text" id="wechat_id" value="{{ user.wechat_id or '' }}" placeholder="匹配成功后发送给对方" autocomplete="off">
        </div>
        <div class="form-group" style="flex:1;">
            <label for="bio">一句话介绍</label>
            <input type="text" id="bio" value="{{ user.bio or '' }}" maxlength="80" placeholder="例：大三心理学在读，喜欢猫咪和下雨天">
        </div>
    </div>
    <div class="form-group" style="margin-top:8px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="allow_cross_school" {% if user.allow_cross_school %}checked{% endif %}>
            允许跨校匹配（双方都开才生效）
        </label>
        <p class="hint">默认同校；勾选后可与其它支持学校的同学配对。</p>
    </div>
</div>

<!-- 进度条 -->
<div class="card progress-sticky" id="progress-card">
    <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-weight:700;font-size:0.9em;">问卷进度</span>
        <div class="progress-bar-container" style="flex:1;margin-bottom:0;">
            <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
        </div>
        <span id="progress-text" class="t-dim" style="font-size:0.85em;white-space:nowrap;">0/40</span>
    </div>
    <p id="progress-hint" class="hint" style="margin:8px 0 0;">点击 1–5 作答量表题；兴趣题至少选一项</p>
</div>

<form id="q-form" onsubmit="return false;">
    <div id="questions-container"><!-- JS 渲染 --></div>

    <div class="card" style="text-align:center;">
        <button type="button" class="btn btn-match" id="submit-btn" onclick="submitAll()">
            提交问卷 & 开始匹配
        </button>
        <p id="save-status" style="margin-top:8px;"></p>
    </div>
</form>

<script>
const QUESTIONS = {{ questions | tojson }};
const EXISTING_ANSWERS = {{ (user.answers or {}) | tojson }};
const EXISTING_IMPORTANT = {{ user.important_qids | list | tojson }};

const dimNames = {
    'values': '核心价值观', 'lifestyle': '生活习惯',
    'emotional': '情感风格', 'interests': '兴趣爱好',
    'expectations': '相处预期'
};
const dimColors = {
    'values': '#a78bfa', 'lifestyle': '#34d399',
    'emotional': '#f472b6', 'interests': '#60a5fa',
    'expectations': '#fbbf24'
};

let answers = {};
let important = new Set(EXISTING_IMPORTANT.map(function (x) { return String(x); }));

// 规范化已有答案为字符串题号
(function loadExisting() {
    var keys = Object.keys(EXISTING_ANSWERS || {});
    for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        answers[String(k)] = EXISTING_ANSWERS[k];
    }
})();

function esc(s) {
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function isAnswered(q) {
    var v = answers[String(q.id)];
    if (q.type === 'scale') {
        return v !== undefined && v !== null && v !== '';
    }
    return Array.isArray(v) && v.length > 0;
}

function render() {
    var c = document.getElementById('questions-container');
    var html = '';
    var dim = null;
    var dimN = 0;

    for (var i = 0; i < QUESTIONS.length; i++) {
        var q = QUESTIONS[i];
        if (q.dimension !== dim) {
            if (dim) html += '</div>';
            dim = q.dimension;
            dimN++;
            html += '<div class="card dimension-card" style="border-left:4px solid ' + dimColors[dim] + ';">'
                + '<h3 style="color:' + dimColors[dim] + ';">' + (dimNames[dim] || dim) + ' <span class="dim-count">(' + dimN + '/5)</span></h3>';
        }

        var qid = String(q.id);
        var val = answers[qid];
        var imp = important.has(qid);
        var db = q.dealbreaker;
        var done = isAnswered(q);

        html += '<div class="q-item' + (db ? ' q-dealbreaker' : '') + (done ? ' q-done' : ' q-todo') + '" id="qcard_' + qid + '" data-qid="' + qid + '">'
            + '<div class="q-head"><span class="q-num">' + q.id + '</span>'
            + '<span class="q-text">' + esc(q.text) + '</span>'
            + (db ? '<span class="q-db">一票否决</span>' : '')
            + '<span class="q-status" id="qs_' + qid + '">' + (done ? '已答' : '未答') + '</span></div>';

        if (q.type === 'scale') {
            html += '<div class="likert-row">'
                + '<span class="scale-l scale-l-left">' + esc(q.left) + '</span>'
                + '<div class="likert-opts" role="radiogroup" aria-label="' + esc(q.text) + '">';
            for (var s = 1; s <= 5; s++) {
                var on = (val !== undefined && Number(val) === s);
                html += '<button type="button" class="likert-btn' + (on ? ' on' : '') + '" id="lb_' + qid + '_' + s + '"'
                    + ' onclick="setScale(' + q.id + ',' + s + ')" aria-pressed="' + (on ? 'true' : 'false') + '">' + s + '</button>';
            }
            html += '</div>'
                + '<span class="scale-l scale-l-right">' + esc(q.right) + '</span>'
                + '</div>';
        } else if (q.type === 'multi') {
            var sel = Array.isArray(val) ? val : [];
            html += '<div class="multi-row">';
            for (var j = 0; j < q.options.length; j++) {
                var opt = q.options[j];
                var selected = sel.indexOf(opt) >= 0;
                html += '<label class="multi-tag' + (selected ? ' on' : '') + '" id="mt_' + qid + '_' + j + '">'
                    + '<input type="checkbox" value="' + esc(opt) + '"' + (selected ? ' checked' : '')
                    + ' onchange="toggleMulti(' + q.id + ',' + j + ',this)" style="display:none;">'
                    + esc(opt) + '</label>';
            }
            html += '</div>';
        }

        html += '<button type="button" class="imp-btn' + (imp ? ' on' : '') + '" id="ib_' + qid
            + '" onclick="toggleImp(' + q.id + ',this)">' + (imp ? '★ 很重要' : '☆ 标记为重要') + '</button>';
        html += '</div>';
    }
    if (dim) html += '</div>';

    c.innerHTML = html;
    updateProgress();
}

function markCard(qid) {
    var q = null;
    for (var i = 0; i < QUESTIONS.length; i++) {
        if (QUESTIONS[i].id === Number(qid) || String(QUESTIONS[i].id) === String(qid)) {
            q = QUESTIONS[i];
            break;
        }
    }
    if (!q) return;
    var card = document.getElementById('qcard_' + qid);
    var status = document.getElementById('qs_' + qid);
    var done = isAnswered(q);
    if (card) {
        card.classList.toggle('q-done', done);
        card.classList.toggle('q-todo', !done);
        card.classList.remove('q-error');
    }
    if (status) status.textContent = done ? '已答' : '未答';
}

function setScale(qid, value) {
    var qs = String(qid);
    answers[qs] = value;
    for (var s = 1; s <= 5; s++) {
        var btn = document.getElementById('lb_' + qs + '_' + s);
        if (!btn) continue;
        var on = s === value;
        btn.classList.toggle('on', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    markCard(qs);
    updateProgress();
}

function toggleMulti(qid, idx, cb) {
    var qs = String(qid);
    if (!Array.isArray(answers[qs])) answers[qs] = [];
    var tag = document.getElementById('mt_' + qs + '_' + idx);
    if (cb.checked) {
        if (answers[qs].indexOf(cb.value) < 0) answers[qs].push(cb.value);
        if (tag) tag.classList.add('on');
    } else {
        answers[qs] = answers[qs].filter(function (v) { return v !== cb.value; });
        if (tag) tag.classList.remove('on');
        if (answers[qs].length === 0) delete answers[qs];
    }
    markCard(qs);
    updateProgress();
}

function toggleImp(qid, btn) {
    var qs = String(qid);
    if (important.has(qs)) {
        important.delete(qs);
        btn.classList.remove('on');
        btn.textContent = '☆ 标记为重要';
    } else {
        important.add(qs);
        btn.classList.add('on');
        btn.textContent = '★ 很重要';
    }
}

function updateProgress() {
    var done = 0;
    for (var i = 0; i < QUESTIONS.length; i++) {
        if (isAnswered(QUESTIONS[i])) done++;
    }
    var pct = Math.round(done / QUESTIONS.length * 100);
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-text').textContent = done + '/' + QUESTIONS.length + ' (' + pct + '%)';
    var hint = document.getElementById('progress-hint');
    if (done < QUESTIONS.length) {
        hint.textContent = '还需完成 ' + (QUESTIONS.length - done) + ' 题（量表点选数字，兴趣至少选 1 项）';
    } else {
        hint.textContent = '全部完成，可以提交啦';
    }
}

function firstUnanswered() {
    for (var i = 0; i < QUESTIONS.length; i++) {
        if (!isAnswered(QUESTIONS[i])) return QUESTIONS[i];
    }
    return null;
}

function highlightMissing() {
    for (var i = 0; i < QUESTIONS.length; i++) {
        var q = QUESTIONS[i];
        var card = document.getElementById('qcard_' + q.id);
        if (!card) continue;
        if (!isAnswered(q)) card.classList.add('q-error');
        else card.classList.remove('q-error');
    }
}

async function submitAll() {
    var name = document.getElementById('name').value.trim();
    var gender = document.getElementById('gender').value;
    var lookingFor = document.getElementById('looking_for').value;
    var wechat = document.getElementById('wechat_id').value.trim();
    var bio = document.getElementById('bio').value.trim();
    var status = document.getElementById('save-status');
    var btn = document.getElementById('submit-btn');

    if (!name) {
        alert('请填写昵称');
        document.getElementById('name').focus();
        document.getElementById('profile-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
    }
    if (!gender) {
        alert('请选择你的性别');
        document.getElementById('gender').focus();
        return;
    }
    if (!lookingFor) {
        alert('请选择希望匹配的性别（择偶取向）');
        document.getElementById('looking_for').focus();
        return;
    }
    if (!wechat) {
        alert('请填写微信号（匹配成功后会发给对方）');
        document.getElementById('wechat_id').focus();
        return;
    }

    var missing = firstUnanswered();
    if (missing) {
        highlightMissing();
        status.innerHTML = '<span class="error">还有未完成的题目，请先答完再提交</span>';
        var el = document.getElementById('qcard_' + missing.id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
    }

    btn.disabled = true;
    btn.textContent = '保存中...';
    status.innerHTML = '<span class="t-dim">保存中...</span>';

    var r1 = await api('PUT', '/api/me', {
        name: name, gender: gender, looking_for: lookingFor, wechat_id: wechat, bio: bio,
        allow_cross_school: document.getElementById('allow_cross_school').checked
    });
    if (!r1.ok) {
        status.innerHTML = '<span class="error">基本资料保存失败: ' + esc(r1.error || '') + '</span>';
        btn.disabled = false;
        btn.textContent = '提交问卷 & 开始匹配';
        return;
    }

    var r2 = await api('POST', '/api/questionnaire', {
        answers: answers,
        important_qids: Array.from(important).map(Number),
    });

    btn.disabled = false;
    btn.textContent = '提交问卷 & 开始匹配';

    if (r2.ok) {
        status.innerHTML = '<span class="t-ok">问卷已保存！正在跳转匹配页...</span>';
        setTimeout(function () { location.href = '/matches'; }, 600);
    } else {
        status.innerHTML = '<span class="error">问卷保存失败: ' + esc(r2.error || '未知错误') + '</span>';
    }
}

render();
</script>
{% endblock %}
