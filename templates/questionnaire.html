{% extends "base.html" %}
{% block content %}

<h2 style="text-align:center;margin-bottom:8px;" data-i18n="qn.title">填写资料 & 问卷</h2>
<p class="hint" style="text-align:center;margin-bottom:16px;"><span data-i18n="qn.sub1">共</span> {{ questions|length }} <span data-i18n="qn.sub2">题 · 请点选作答；未选不算已答</span></p>

<!-- 基本资料 -->
<div class="card" id="profile-card">
    <h3 data-i18n="qn.basic">基本信息</h3>
    <div class="form-row">
        <div class="form-group" style="flex:1;">
            <label for="name" data-i18n="qn.name">昵称 *</label>
            <input type="text" id="name" value="{{ user.name or '' }}" placeholder="你的名字" data-i18n-ph="qn.name.ph" autocomplete="nickname">
        </div>
        <div class="form-group" style="flex:1;">
            <label for="gender" data-i18n="qn.gender">我的性别 *</label>
            <select id="gender">
                <option value="" data-i18n="qn.select">请选择</option>
                <option value="male" {% if user.gender == 'male' %}selected{% endif %} data-i18n="qn.male">男</option>
                <option value="female" {% if user.gender == 'female' %}selected{% endif %} data-i18n="qn.female">女</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label for="looking_for" data-i18n="qn.lf">希望匹配的性别（择偶取向）*</label>
        <select id="looking_for">
            <option value="" data-i18n="qn.select">请选择</option>
            <option value="male" {% if user.looking_for == 'male' %}selected{% endif %} data-i18n="qn.male">男</option>
            <option value="female" {% if user.looking_for == 'female' %}selected{% endif %} data-i18n="qn.female">女</option>
            <option value="both" {% if user.looking_for == 'both' %}selected{% endif %} data-i18n="qn.lf.both">男女都可以</option>
        </select>
        <p class="hint" data-i18n="qn.lf.hint">男生可选男或女，女生也可选男或女；匹配需双方取向互相接受。</p>
    </div>
    <div class="form-row">
        <div class="form-group" style="flex:1;">
            <label for="wechat_id" data-i18n="qn.wechat">微信号 *</label>
            <input type="text" id="wechat_id" value="{{ user.wechat_id or '' }}" placeholder="匹配成功后发送给对方" data-i18n-ph="qn.wechat.ph" autocomplete="off">
        </div>
        <div class="form-group" style="flex:1;">
            <label for="bio" data-i18n="qn.bio">一句话介绍</label>
            <input type="text" id="bio" value="{{ user.bio or '' }}" maxlength="80" placeholder="例：大三心理学在读，喜欢猫咪和下雨天" data-i18n-ph="qn.bio.ph">
        </div>
    </div>
    <div class="form-group" style="margin-top:8px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="allow_cross_school" {% if user.allow_cross_school %}checked{% endif %}>
            <span data-i18n="qn.cross">允许跨校匹配（双方都开才生效）</span>
        </label>
        <p class="hint" data-i18n="qn.cross.hint">默认同校；勾选后可与其它支持学校的同学配对。</p>
    </div>
</div>

<!-- 进度条 -->
<div class="card progress-sticky" id="progress-card">
    <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-weight:700;font-size:0.9em;" data-i18n="qn.progress">问卷进度</span>
        <div class="progress-bar-container" style="flex:1;margin-bottom:0;">
            <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
        </div>
        <span id="progress-text" class="t-dim" style="font-size:0.85em;white-space:nowrap;">0/39</span>
    </div>
    <p id="progress-hint" class="hint" style="margin:8px 0 0;">点击 1–5 作答量表题；兴趣题至少选一项</p>
    <div class="box box-warn" style="margin-top:12px;text-align:left;">
        <p style="margin:0;font-weight:700;font-size:0.9em;" data-i18n="qn.db.title">什么是「一票否决」？</p>
        <p class="hint" style="margin:6px 0 0;" data-i18n="qn.db.hint">标有「一票否决」的题（婚姻、孩子、出轨、吸烟接受度）是硬性底线：出现明确冲突时，系统会直接跳过对方。请按真实想法作答。</p>
    </div>
</div>

<form id="q-form" onsubmit="return false;">
    <div id="questions-container"><!-- JS 渲染 --></div>

    <div class="card" style="text-align:center;">
        <button type="button" class="btn btn-match" id="submit-btn" onclick="submitAll()" data-i18n="qn.submit">
            提交问卷 & 开始匹配
        </button>
        <p id="save-status" style="margin-top:8px;"></p>
    </div>
</form>

<script>
const QUESTIONS = {{ questions | tojson }};
const EXISTING_ANSWERS = {{ (user.answers or {}) | tojson }};
const EXISTING_IMPORTANT = {{ user.important_qids | list | tojson }};

const dimColors = {
    'values': '#7c3aed', 'lifestyle': '#059669',
    'emotional': '#db2777', 'interests': '#2563eb',
    'expectations': '#d97706'
};

let answers = {};
let important = new Set(EXISTING_IMPORTANT.map(function (x) { return String(x); }));

// 规范化已有答案为字符串题号
(function loadExisting() {
    var keys = Object.keys(EXISTING_ANSWERS || {});
    for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        answers[String(k)] = EXISTING_ANSWERS[k];
    }
})();

function esc(s) {
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function isAnswered(q) {
    var v = answers[String(q.id)];
    if (q.type === 'scale') {
        return v !== undefined && v !== null && v !== '';
    }
    return Array.isArray(v) && v.length > 0;
}

function render() {
    var c = document.getElementById('questions-container');
    var html = '';
    var dim = null;
    var dimN = 0;

    for (var i = 0; i < QUESTIONS.length; i++) {
        var q = QUESTIONS[i];
        if (q.dimension !== dim) {
            if (dim) html += '</div>';
            dim = q.dimension;
            dimN++;
            html += '<div class="card dimension-card" style="border-left:4px solid ' + dimColors[dim] + ';">'
                + '<h3 style="color:' + dimColors[dim] + ';">' + t('dim.' + dim) + ' <span class="dim-count">(' + dimN + '/5)</span></h3>';
        }

        var qid = String(q.id);
        var val = answers[qid];
        var imp = important.has(qid);
        var db = q.dealbreaker;
        var done = isAnswered(q);

        html += '<div class="q-item' + (db ? ' q-dealbreaker' : '') + (done ? ' q-done' : ' q-todo') + '" id="qcard_' + qid + '" data-qid="' + qid + '">'
            + '<div class="q-head"><span class="q-num">' + q.id + '</span>'
            + '<span class="q-text">' + esc(qi(q, 'text')) + '</span>'
            + (db ? '<span class="q-db" title="' + esc(t('qn.db.tip')) + '">' + t('qn.db') + '</span>' : '')
            + '<span class="q-status" id="qs_' + qid + '">' + (done ? t('qn.done') : t('qn.todo')) + '</span></div>';
        if (db) {
            html += '<p class="hint q-db-hint">' + esc(t('qn.db.tip')) + '</p>';
        }

        if (q.type === 'scale') {
            html += '<div class="likert-row">'
                + '<span class="scale-l scale-l-left">' + esc(qi(q, 'left')) + '</span>'
                + '<div class="likert-opts" role="radiogroup" aria-label="' + esc(qi(q, 'text')) + '">';
            for (var s = 1; s <= 5; s++) {
                var on = (val !== undefined && Number(val) === s);
                html += '<button type="button" class="likert-btn' + (on ? ' on' : '') + '" id="lb_' + qid + '_' + s + '"'
                    + ' onclick="setScale(' + q.id + ',' + s + ')" aria-pressed="' + (on ? 'true' : 'false') + '">' + s + '</button>';
            }
            html += '</div>'
                + '<span class="scale-l scale-l-right">' + esc(qi(q, 'right')) + '</span>'
                + '</div>';
        } else if (q.type === 'multi') {
            var sel = Array.isArray(val) ? val : [];
            var labels = qOptLabels(q);
            html += '<div class="multi-row">';
            for (var j = 0; j < q.options.length; j++) {
                // 展示当前语言标签，提交仍存简体原值（q.options[j]）
                var opt = q.options[j];
                var selected = sel.indexOf(opt) >= 0;
                html += '<label class="multi-tag' + (selected ? ' on' : '') + '" id="mt_' + qid + '_' + j + '">'
                    + '<input type="checkbox" value="' + esc(opt) + '"' + (selected ? ' checked' : '')
                    + ' onchange="toggleMulti(' + q.id + ',' + j + ',this)" style="display:none;">'
                    + esc(labels[j]) + '</label>';
            }
            html += '</div>';
        }

        html += '<button type="button" class="imp-btn' + (imp ? ' on' : '') + '" id="ib_' + qid
            + '" onclick="toggleImp(' + q.id + ',this)">' + (imp ? t('qn.imp.on') : t('qn.imp.off')) + '</button>';
        html += '</div>';
    }
    if (dim) html += '</div>';

    c.innerHTML = html;
    updateProgress();
}

function markCard(qid) {
    var q = null;
    for (var i = 0; i < QUESTIONS.length; i++) {
        if (QUESTIONS[i].id === Number(qid) || String(QUESTIONS[i].id) === String(qid)) {
            q = QUESTIONS[i];
            break;
        }
    }
    if (!q) return;
    var card = document.getElementById('qcard_' + qid);
    var status = document.getElementById('qs_' + qid);
    var done = isAnswered(q);
    if (card) {
        card.classList.toggle('q-done', done);
        card.classList.toggle('q-todo', !done);
        card.classList.remove('q-error');
    }
    if (status) status.textContent = done ? t('qn.done') : t('qn.todo');
}

function setScale(qid, value) {
    var qs = String(qid);
    answers[qs] = value;
    for (var s = 1; s <= 5; s++) {
        var btn = document.getElementById('lb_' + qs + '_' + s);
        if (!btn) continue;
        var on = s === value;
        btn.classList.toggle('on', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    markCard(qs);
    updateProgress();
}

function toggleMulti(qid, idx, cb) {
    var qs = String(qid);
    if (!Array.isArray(answers[qs])) answers[qs] = [];
    var q = null;
    for (var i = 0; i < QUESTIONS.length; i++) {
        if (QUESTIONS[i].id === Number(qid)) { q = QUESTIONS[i]; break; }
    }
    if (!q) return;
    var exclusive = q.exclusive_options || [];

    if (cb.checked) {
        if (exclusive.indexOf(cb.value) >= 0) {
            // “不玩/不运动/暂不确定”等只能单独选择。
            answers[qs] = [cb.value];
        } else {
            answers[qs] = answers[qs].filter(function (v) {
                return exclusive.indexOf(v) < 0;
            });
            if (answers[qs].indexOf(cb.value) < 0) answers[qs].push(cb.value);
        }
    } else {
        answers[qs] = answers[qs].filter(function (v) { return v !== cb.value; });
        if (answers[qs].length === 0) delete answers[qs];
    }

    // 同步同题所有复选框与标签的视觉状态。
    for (var j = 0; j < q.options.length; j++) {
        var tag = document.getElementById('mt_' + qs + '_' + j);
        if (!tag) continue;
        var selected = Array.isArray(answers[qs]) && answers[qs].indexOf(q.options[j]) >= 0;
        tag.classList.toggle('on', selected);
        var input = tag.querySelector('input');
        if (input) input.checked = selected;
    }
    markCard(qs);
    updateProgress();
}

function toggleImp(qid, btn) {
    var qs = String(qid);
    if (important.has(qs)) {
        important.delete(qs);
        btn.classList.remove('on');
        btn.textContent = t('qn.imp.off');
    } else {
        important.add(qs);
        btn.classList.add('on');
        btn.textContent = t('qn.imp.on');
    }
}

function updateProgress() {
    var done = 0;
    for (var i = 0; i < QUESTIONS.length; i++) {
        if (isAnswered(QUESTIONS[i])) done++;
    }
    var pct = Math.round(done / QUESTIONS.length * 100);
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-text').textContent = done + '/' + QUESTIONS.length + ' (' + pct + '%)';
    var hint = document.getElementById('progress-hint');
    if (done < QUESTIONS.length) {
        hint.textContent = t('qn.left') + ' ' + (QUESTIONS.length - done) + ' ' + t('qn.left2');
    } else {
        hint.textContent = t('qn.alldone');
    }
}

function firstUnanswered() {
    for (var i = 0; i < QUESTIONS.length; i++) {
        if (!isAnswered(QUESTIONS[i])) return QUESTIONS[i];
    }
    return null;
}

function highlightMissing() {
    for (var i = 0; i < QUESTIONS.length; i++) {
        var q = QUESTIONS[i];
        var card = document.getElementById('qcard_' + q.id);
        if (!card) continue;
        if (!isAnswered(q)) card.classList.add('q-error');
        else card.classList.remove('q-error');
    }
}

async function submitAll() {
    var name = document.getElementById('name').value.trim();
    var gender = document.getElementById('gender').value;
    var lookingFor = document.getElementById('looking_for').value;
    var wechat = document.getElementById('wechat_id').value.trim();
    var bio = document.getElementById('bio').value.trim();
    var status = document.getElementById('save-status');
    var btn = document.getElementById('submit-btn');

    if (!name) {
        alert(t('qn.needName'));
        document.getElementById('name').focus();
        document.getElementById('profile-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
    }
    if (!gender) {
        alert(t('qn.needGender'));
        document.getElementById('gender').focus();
        return;
    }
    if (!lookingFor) {
        alert(t('qn.needLf'));
        document.getElementById('looking_for').focus();
        return;
    }
    if (!wechat) {
        alert(t('qn.needWechat'));
        document.getElementById('wechat_id').focus();
        return;
    }

    var missing = firstUnanswered();
    if (missing) {
        highlightMissing();
        status.innerHTML = '<span class="error">' + t('qn.missing') + '</span>';
        var el = document.getElementById('qcard_' + missing.id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
    }

    btn.disabled = true;
    btn.textContent = t('qn.saving');
    status.innerHTML = '<span class="t-dim">' + t('qn.saving') + '</span>';

    var r1 = await api('PUT', '/api/me', {
        name: name, gender: gender, looking_for: lookingFor, wechat_id: wechat, bio: bio,
        allow_cross_school: document.getElementById('allow_cross_school').checked
    });
    if (!r1.ok) {
        status.innerHTML = '<span class="error">' + t('qn.profileFail') + esc(r1.error || '') + '</span>';
        btn.disabled = false;
        btn.textContent = t('qn.submit');
        return;
    }

    var r2 = await api('POST', '/api/questionnaire', {
        answers: answers,
        important_qids: Array.from(important).map(Number),
    });

    btn.disabled = false;
    btn.textContent = t('qn.submit');

    if (r2.ok) {
        status.innerHTML = '<span class="t-ok">' + t('qn.saved') + '</span>';
        setTimeout(function () { location.href = '/matches'; }, 600);
    } else {
        status.innerHTML = '<span class="error">' + t('qn.saveFail') + esc(r2.error || '') + '</span>';
    }
}

render();

// 切换语言时就地重渲染题目（答案保存在内存，不丢失）
window.addEventListener('cm:lang', function () { render(); });
</script>
{% endblock %}
