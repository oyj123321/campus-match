{% extends "base.html" %}
{% block content %}

<h2 style="text-align:center;margin-bottom:16px;">填写资料 & 问卷</h2>

<!-- 基本资料 -->
<div class="card">
    <h3>基本信息</h3>
    <div class="form-row">
        <div class="form-group" style="flex:1;">
            <label for="name">昵称 *</label>
            <input type="text" id="name" value="{{ user.name or '' }}" placeholder="你的名字">
        </div>
        <div class="form-group" style="flex:1;">
            <label for="gender">性别 *</label>
            <select id="gender">
                <option value="">请选择</option>
                <option value="male" {% if user.gender == 'male' %}selected{% endif %}>男</option>
                <option value="female" {% if user.gender == 'female' %}selected{% endif %}>女</option>
            </select>
        </div>
    </div>
    <div class="form-row">
        <div class="form-group" style="flex:1;">
            <label for="wechat_id">微信号 *</label>
            <input type="text" id="wechat_id" value="{{ user.wechat_id or '' }}" placeholder="匹配成功后发送给对方">
        </div>
        <div class="form-group" style="flex:1;">
            <label for="bio">一句话介绍</label>
            <input type="text" id="bio" value="{{ user.bio or '' }}" maxlength="80" placeholder="例：大三心理学在读，喜欢猫咪和下雨天">
        </div>
    </div>
</div>

<!-- 进度条 -->
<div class="card" style="position:sticky;top:0;z-index:10;">
    <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-weight:700;font-size:0.9em;">问卷进度</span>
        <div class="progress-bar-container" style="flex:1;">
            <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
        </div>
        <span id="progress-text" style="font-size:0.85em;color:#999;white-space:nowrap;">0/32</span>
    </div>
</div>

<form id="q-form">
    <div id="questions-container"><!-- JS 渲染 --></div>

    <div class="card" style="text-align:center;">
        <button type="button" class="btn btn-match" id="submit-btn" onclick="submitAll()">
            提交问卷 & 开始匹配
        </button>
        <p id="save-status" style="margin-top:8px;"></p>
    </div>
</form>

<script>
const QUESTIONS = {{ questions | tojson | safe }};
const EXISTING_ANSWERS = {{ user.answers | tojson | safe }};
const EXISTING_IMPORTANT = {{ user.important_qids | list | tojson | safe }};

const dimNames = {
    'values': '核心价值观', 'lifestyle': '生活习惯',
    'emotional': '情感风格', 'interests': '兴趣爱好'
};
const dimColors = {
    'values': '#7c3aed', 'lifestyle': '#059669',
    'emotional': '#db2777', 'interests': '#2563eb'
};

let answers = {};
let important = new Set(EXISTING_IMPORTANT.map(String));
{% if user.answers %}
Object.assign(answers, {{ user.answers | tojson | safe }});
{% endif %}

function render() {
    var c = document.getElementById('questions-container');
    var html = '';
    var dim = null;
    var dimN = 0;

    for (var i = 0; i < QUESTIONS.length; i++) {
        var q = QUESTIONS[i];
        if (q.dimension !== dim) {
            if (dim) html += '</div>';
            dim = q.dimension;
            dimN++;
            html += '<div class="card dimension-card" style="border-left:4px solid ' + dimColors[dim] + ';">'
                + '<h3 style="color:' + dimColors[dim] + ';">' + dimNames[dim] + ' (' + dimN + '/4)</h3>';
        }

        var qid = String(q.id);
        var val = answers[qid];
        var imp = important.has(qid);
        var db = q.dealbreaker;

        html += '<div class="q-item' + (db ? ' q-dealbreaker' : '') + '" id="qcard_' + qid + '">'
            + '<div class="q-head"><span class="q-num">' + q.id + '</span>'
            + '<span>' + q.text + '</span>'
            + (db ? '<span class="q-db">一票否决</span>' : '') + '</div>';

        if (q.type === 'scale') {
            var v = val !== undefined ? val : 3;
            html += '<div class="scale-row">'
                + '<span class="scale-l">' + q.left + '</span>'
                + '<div class="scale-mid">'
                + '<input type="range" min="1" max="5" value="' + v + '" class="scale-rng"'
                + ' id="q_' + qid + '" oninput="updateScale(' + qid + ')">'
                + '<div class="scale-ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>'
                + '</div>'
                + '<span class="scale-l">' + q.right + '</span>'
                + '<span class="scale-v" id="sv_' + qid + '">' + v + '</span>'
                + '</div>';
        } else if (q.type === 'multi') {
            var sel = Array.isArray(val) ? val : [];
            html += '<div class="multi-row">';
            for (var j = 0; j < q.options.length; j++) {
                var opt = q.options[j];
                var on = sel.indexOf(opt) >= 0;
                html += '<label class="multi-tag' + (on ? ' on' : '') + '" id="mt_' + qid + '_' + j + '">'
                    + '<input type="checkbox" value="' + opt + '"' + (on ? ' checked' : '')
                    + ' onchange="toggleMulti(' + qid + ',' + j + ',this)" style="display:none;">'
                    + opt + '</label>';
            }
            html += '</div>';
        }

        html += '<button type="button" class="imp-btn' + (imp ? ' on' : '') + '" id="ib_' + qid
            + '" onclick="toggleImp(' + qid + ',this)">' + (imp ? '星 很重要' : '星 标记为重要') + '</button>';
    }
    if (dim) html += '</div>';

    c.innerHTML = html;
    updateProgress();
}

function updateScale(qid) {
    var s = document.getElementById('q_' + qid);
    document.getElementById('sv_' + qid).textContent = s.value;
    answers[String(qid)] = parseInt(s.value);
    updateProgress();
}

function toggleMulti(qid, idx, cb) {
    var qs = String(qid);
    if (!answers[qs]) answers[qs] = [];
    var tag = document.getElementById('mt_' + qid + '_' + idx);
    if (cb.checked) {
        if (answers[qs].indexOf(cb.value) < 0) answers[qs].push(cb.value);
        tag.classList.add('on');
    } else {
        answers[qs] = answers[qs].filter(function(v) { return v !== cb.value; });
        tag.classList.remove('on');
        if (answers[qs].length === 0) delete answers[qs];
    }
    updateProgress();
}

function toggleImp(qid, btn) {
    var qs = String(qid);
    if (important.has(qs)) { important.delete(qs); btn.classList.remove('on'); btn.textContent = '星 标记为重要'; }
    else { important.add(qs); btn.classList.add('on'); btn.textContent = '星 很重要'; }
}

function updateProgress() {
    var done = Object.keys(answers).length;
    var pct = Math.round(done / QUESTIONS.length * 100);
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-text').textContent = done + '/' + QUESTIONS.length + ' (' + pct + '%)';
}

async function submitAll() {
    var name = document.getElementById('name').value.trim();
    var gender = document.getElementById('gender').value;
    var wechat = document.getElementById('wechat_id').value.trim();
    var bio = document.getElementById('bio').value.trim();
    var status = document.getElementById('save-status');
    var btn = document.getElementById('submit-btn');

    if (!name) { alert('请填写名字'); return; }
    if (!gender) { alert('请选择性别'); return; }
    if (!wechat) { alert('请填写微信号'); return; }

    btn.disabled = true;
    btn.textContent = '保存中...';
    status.innerHTML = '保存中...';

    // 收集所有 scale 题当前值
    QUESTIONS.forEach(function(q) {
        if (q.type === 'scale') {
            var s = document.getElementById('q_' + q.id);
            if (s) answers[String(q.id)] = parseInt(s.value);
        }
    });

    // 先保存基本资料
    var r1 = await api('PUT', '/api/me', { name: name, gender: gender, wechat_id: wechat, bio: bio });
    if (!r1.ok) { status.innerHTML = '基本资料保存失败: ' + r1.error; btn.disabled = false; btn.textContent = '提交问卷 & 开始匹配'; return; }

    // 再保存问卷
    var r2 = await api('POST', '/api/questionnaire', {
        answers: answers,
        important_qids: Array.from(important).map(Number),
    });

    btn.disabled = false;
    btn.textContent = '提交问卷 & 开始匹配';

    if (r2.ok) {
        status.innerHTML = '问卷已保存! 跳转到匹配页面...';
        setTimeout(function() { location.href = '/matches'; }, 800);
    } else {
        status.innerHTML = '问卷保存失败: ' + r2.error;
    }
}

// 初始化
render();
</script>
{% endblock %}
