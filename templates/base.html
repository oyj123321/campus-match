<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMatch — 校园恋爱匹配</title>
    <link rel="stylesheet" href="/static/style.css?v=1928">
    <script src="/static/i18n.js?v=1928"></script>
    <script src="/static/love_personality_i18n.js?v=1928"></script>
    <script src="/static/vendor/html2canvas.min.js"></script>
    <script src="/static/personality_share.js?v=1928"></script>
    <script>
        // 全局 Ajax 封装（带错误处理）——放在 head，保证页面内脚本可用
        async function api(method, url, body) {
            try {
                const opts = {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                };
                if (body) opts.body = JSON.stringify(body);

                const res = await fetch(url, opts);
                if (!res.ok) {
                    const text = await res.text();
                    try {
                        const errData = JSON.parse(text);
                        return { ok: false, error: errData.error || `HTTP ${res.status}` };
                    } catch {
                        return { ok: false, error: `服务器错误 (${res.status})` };
                    }
                }
                return await res.json();
            } catch (e) {
                console.error('API Error:', e);
                return { ok: false, error: '网络请求失败，请检查服务器是否运行' };
            }
        }

        async function logout() {
            await api('POST', '/api/logout');
            window.location.href = '/';
        }
    </script>
</head>
<body>
    <!-- 动态背景：柔光晕 + 网格 -->

        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="orb orb-c"></div>

    <div class="grid-overlay" aria-hidden="true"></div>

    <!-- 大湾区地标主视觉（澳门为主）：占据上半屏 -->

                    <stop offset="1" stop-color="#ec74b8"/>

            </defs>
            <!-- 远景楼群 -->
            <g fill="url(#gbaGrad)" opacity="0.32">
                <rect x="40" y="470" width="40" height="90"/>
                <rect x="96" y="492" width="30" height="68"/>
                <rect x="250" y="480" width="34" height="80"/>
                <rect x="560" y="500" width="28" height="60"/>

                <rect x="900" y="492" width="30" height="68"/>

                <rect x="1345" y="496" width="26" height="64"/>
            </g>
            <g fill="url(#gbaGrad)">

                <rect x="112" y="296" width="96" height="12" rx="6"/>
                <rect x="128" y="318" width="64" height="9" rx="4.5"/>
                <path d="M132 560 L152 384 L168 384 L188 560 Z"/>
                <!-- 新葡京（莲花火炬塔 + 蛋形裙楼 + 塔尖） -->
                <rect x="427" y="16" width="6" height="52"/>
                <path d="M419 330 L372 168 L396 100 L430 64 L464 100 L488 168 L441 330 Z"/>
                <path d="M410 480 L419 330 L441 330 L450 480 Z"/>
                <path d="M340 560 Q340 470 430 470 Q520 470 520 560 Z"/>
                <!-- 大三巴牌坊（五层立面 + 门窗洞 + 十字架） -->
                <rect x="757" y="178" width="6" height="30"/>
                <rect x="747" y="188" width="26" height="6"/>
                <path d="M704 290 L760 218 L816 290 Z M760 250 m-10 0 a10 10 0 1 0 20 0 a10 10 0 1 0 -20 0 Z" fill-rule="evenodd"/>
                <path d="M712 290 H808 V340 H712 Z M748 300 h24 v30 h-24 Z" fill-rule="evenodd"/>
                <path d="M684 340 H836 V398 H684 Z M706 352 h22 v34 h-22 Z M749 352 h22 v34 h-22 Z M792 352 h22 v34 h-22 Z" fill-rule="evenodd"/>
                <path d="M660 398 H860 V466 H660 Z M688 412 h30 v42 h-30 Z M745 412 h30 v42 h-30 Z M802 412 h30 v42 h-30 Z" fill-rule="evenodd"/>
                <path d="M640 466 H880 V536 H846 V486 H806 V536 H780 V478 H740 V536 H714 V486 H674 V536 H640 Z"/>
                <rect x="624" y="536" width="272" height="12"/>
                <rect x="600" y="548" width="320" height="12"/>
                <!-- 澳门科学馆（斜锥） -->
                <path d="M930 560 L1030 560 L1056 396 Q1058 378 1040 376 L966 394 Z"/>
                <circle cx="920" cy="548" r="22"/>
                <!-- 香港楼群（次要）：IFC / 中银大厦 / ICC -->
                <path d="M1170 560 V330 L1178 310 H1216 L1224 330 V560 Z"/>
                <rect x="1178" y="296" width="6" height="16"/>
                <rect x="1192" y="290" width="6" height="22"/>
                <rect x="1206" y="296" width="6" height="16"/>
                <path d="M1272 560 V420 L1312 336 V560 Z"/>
                <path d="M1312 336 L1326 360 V560 H1312 Z" opacity="0.75"/>
                <rect x="1300" y="300" width="3" height="40"/>
                <rect x="1312" y="306" width="3" height="34"/>
                <path d="M1368 560 V372 L1378 352 H1420 L1430 372 V560 Z"/>
                <!-- 地平线 -->
                <rect x="0" y="556" width="1440" height="4" opacity="0.5"/>
            </g>
        </svg>
    </div>

    <!-- 下侧填充：海面波浪 + 港珠澳大桥 -->

        <div class="bridge">
            <svg viewBox="0 0 1440 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                <rect x="0" y="44" width="1440" height="5" rx="2.5"/>
                <rect x="477" y="6" width="6" height="42"/>
                <path d="M395 44 L480 12 L565 44 Z" opacity="0.35"/>
                <rect x="897" y="6" width="6" height="42"/>
                <path d="M815 44 L900 12 L985 44 Z" opacity="0.35"/>
            </svg>
        </div>
        <div class="wave w1">
            <svg viewBox="0 0 2880 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path fill="currentColor" d="M0 40 q60 -22 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 L2880 80 L0 80 Z"/>
            </svg>
        </div>
        <div class="wave w2">
            <svg viewBox="0 0 2880 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path fill="currentColor" d="M0 44 q60 -18 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 L2880 80 L0 80 Z"/>
            </svg>
        </div>
    </div>

    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="nav-brand">CampusMatch</a>
            <div class="nav-right">
                {% if session.user_id %}
                    <a href="/matches" class="nav-link" data-i18n="nav.matches">匹配结果</a>
                    <a href="/questionnaire" class="nav-link" data-i18n="nav.questionnaire">问卷</a>
                    <a href="/" class="nav-link" onclick="logout(); return false;" data-i18n="nav.logout">返回首页</a>
                {% endif %}
                <select id="lang-sel" class="lang-select" onchange="setLang(this.value)" aria-label="Language">
                    <option value="zh">简中</option>
                    <option value="tw">繁中</option>
                    <option value="en">EN</option>
                    <option value="pt">PT</option>
                </select>
            </div>
        </div>
    </nav>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p data-i18n="footer.line1">CampusMatch — 深度问卷 · 算法匹配 · 每周揭晓</p>
        <p style="margin-top:6px;">
            <a href="/privacy" data-i18n="footer.privacy">隐私政策</a>
            <span aria-hidden="true"> · </span>
            <span data-i18n="footer.line2">账号删除 / 反馈：请用你的学校邮箱写信至</span>
            <a href="mailto:{{ contact_email }}">{{ contact_email }}</a>
        </p>
    </footer>

</body>
</html>
